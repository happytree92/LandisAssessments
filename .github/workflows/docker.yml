name: Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks           # never publish :latest from a commit that fails typecheck or tests
    runs-on: ubuntu-latest  # real x86_64 hardware — no emulation, no QEMU

    permissions:
      contents: read
      packages: write       # allows pushing to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/happytree92/landisassessments:latest
