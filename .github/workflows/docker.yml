name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request: # builds both architectures to prove they compile; nothing is pushed

env:
  IMAGE: ghcr.io/happytree92/landisassessments

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks           # never publish :latest from a commit that fails typecheck or tests
    strategy:
      fail-fast: false      # if one architecture breaks, still see whether the other builds
      matrix:
        include:
          - arch: amd64       # Synology NAS
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64       # Orange Pi 5 and other 64-bit ARM boards
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}  # real hardware for each architecture — no emulation, no QEMU

    permissions:
      contents: read
      packages: write       # allows pushing to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture is pushed untagged, by digest. The publish job below
      # points :latest at both, so `docker pull` picks the right one per machine.
      - name: Build (and push by digest on main)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}

      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: build            # both architectures must build, or :latest stays where it was
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag both architectures as :latest
        working-directory: ${{ runner.temp }}/digests
        run: docker buildx imagetools create -t "$IMAGE:latest" $(printf "$IMAGE@sha256:%s " *)

      - name: Show published platforms
        run: docker buildx imagetools inspect "$IMAGE:latest"
